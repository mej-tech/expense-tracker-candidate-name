<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Enter description">
                </div>

                <p id="form-message"></p>

                <button type="submit">Add Transaction</button>

            </form>
        </section>

        <section class="transactions-section">

            <div class="transactions-header">
                <h2>Transactions</h2>

                <select id="filter">
                    <option value="all">All Transactions</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div id="transaction-list"></div>

        </section>

        <section class="analytics-section">

            <div class="analytics-card">
                <h2>Monthly Expense Summary</h2>

                <div class="month-selector">
                    <label for="month-filter">Select Month</label>
                    <input type="month" id="month-filter">
                </div>

                <div class="monthly-summary">
                    <div>
                        <span>Monthly Expenses</span>
                        <strong id="monthly-expenses">₹0.00</strong>
                    </div>

                    <div>
                        <span>Number of Expenses</span>
                        <strong id="monthly-count">0</strong>
                    </div>
                </div>
            </div>

            <div class="analytics-card">
                <h2>Category-wise Expenses</h2>

                <div id="expense-chart" class="expense-chart"></div>

                <p id="chart-message" class="chart-message">
                    No expense data available.
                </p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
